<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Остановки — Управление</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Скрытие меню на весь экран */
    body.fullscreen .sidebar, body.fullscreen .topbar { display: none !important; }
    body.fullscreen .main { margin-left: 0 !important; }
    body.fullscreen .content { padding: 0 !important; height: 100vh; overflow: hidden; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; background: var(--panel); padding: 0 16px; }
    .tab { background: transparent; border: none; color: var(--muted); padding: 14px 20px; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.05em; }
    .tab.active { color: var(--brand); border-bottom-color: var(--brand); }

    /* Сплит-экран 30/70 */
    .split-wrapper { display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
    .split-form { flex: 0 0 30%; padding: 24px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; }
    .split-map { flex: 0 0 70%; position: relative; background: #e5e5e5; }
    #map-add { width: 100%; height: 100%; }

    /* Реестр */
    .list-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .list-header { padding: 12px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: rgba(0,0,0,0.1); }
    .list-header select, .list-header input { padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
    .table-scroll { max-height: calc(100vh - 220px); overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { position: sticky; top: 0; background: var(--panel); z-index: 10; padding: 10px; text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
    td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
    tr:hover td { background: rgba(37,99,235,0.05); }

    /* Статусные селекты в таблице */
    .status-select { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; border: 1px solid transparent; cursor: pointer; }
    .status-active { background: rgba(22,163,74,0.15); color: #16a34a; border-color: rgba(22,163,74,0.3); }
    .status-reconstruction { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: rgba(245,158,11,0.3); }
    .status-closed { background: rgba(220,38,38,0.15); color: #dc2626; border-color: rgba(220,38,38,0.3); }

    /* Настройки */
    .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; display: none; backdrop-filter: blur(2px); }
    .settings-overlay.open { display: block; }
    .settings-panel { position: fixed; top: 0; right: -350px; width: 350px; height: 100vh; background: var(--panel); border-left: 1px solid var(--border); z-index: 3001; transition: right 0.3s; padding: 24px; box-shadow: -5px 0 20px rgba(0,0,0,0.3); overflow-y: auto; }
    .settings-panel.open { right: 0; }
    .settings-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
    .settings-group { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .settings-group h3 { margin: 0 0 12px 0; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* Карта */
    .popup-content h4 { margin: 0 0 6px; font-size: 15px; }
    .popup-content p { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
    .popup-actions { display: flex; gap: 6px; margin-top: 10px; }
    .popup-actions button { flex: 1; padding: 6px; font-size: 12px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .popup-actions button:hover { background: var(--border); }
    .popup-actions button.del { border-color: var(--err); color: #fca5a5; }

    /* JSON зона */
    .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 40px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 12px; transition: 0.2s; }
    .drop-zone.dragover { border-color: var(--brand); background: rgba(37,99,235,0.1); color: var(--text); }
    .json-area { width: 100%; height: 200px; font-family: monospace; font-size: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 8px; resize: vertical; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stops.js"></script>
</body>
</html>
