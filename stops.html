<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Остановки — Управление транспортом</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Geocoder CSS (для поиска по адресу) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  
  <style>
    /* Стили для модалки и карты */
    .modal-map-wrapper { display: flex; gap: 16px; height: 350px; margin-bottom: 16px; }
    .map-container { flex: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    #modal-map { width: 100%; height: 100%; }
    .coords-input-group { display: flex; gap: 8px; margin-top: 4px; }
    .coords-input-group input { font-family: monospace; }
    .modal__body { min-width: 600px; } /* Чтобы карта была широкой */
    @media (max-width: 768px) {
      .modal__body { min-width: auto; }
      .modal-map-wrapper { flex-direction: column; height: auto; }
      .map-container { height: 250px; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stops.js"></script>
</body>
</html>
