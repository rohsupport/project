<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Остановки — Управление</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Темы */
    :root {
      --font-size-base: 14px;
      --table-row-pad: 10px;
    }
    body.light-theme {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --card: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #2563eb;
    }
    body.dense-table {
      --table-row-pad: 4px;
    }
    body.large-font {
      --font-size-base: 16px;
    }
    body {
      font-size: var(--font-size-base);
    }
    th, td {
      padding-top: var(--table-row-pad);
      padding-bottom: var(--table-row-pad);
    }

    /* Скрываем меню и шапку в полноэкранном режиме */
    body.fullscreen .sidebar, body.fullscreen .topbar { display: none !important; }
    body.fullscreen .main { margin-left: 0 !important; }
    body.fullscreen .content { padding: 0 !important; height: 100vh; }

    /* Вкладки */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .tab { background: transparent; border: none; color: var(--muted); padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.05em; }
    .tab.active { color: var(--brand); border-bottom-color: var(--brand); }

    /* Сплит */
    .split { display: flex; height: 100vh; background: var(--bg); }
    .split-form { flex: 0 0 30%; padding: 24px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; }
    .split-map { flex: 1; position: relative; }
    #map-add, #map-all { width: 100%; height: 100%; }

    .recent-box { margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px; max-height: 150px; overflow-y: auto; }
    .recent-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid rgba(128,128,128,0.1); display: flex; justify-content: space-between; }

    /* Настройки */
    .settings-btn { position: fixed; bottom: 20px; right: 20px; z-index: 998; padding: 12px 20px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: var(--shadow); }
    .settings-panel { position: fixed; top: 0; right: -400px; width: 400px; height: 100vh; background: var(--panel); border-left: 1px solid var(--border); z-index: 1000; transition: right 0.3s; padding: 24px; box-shadow: -5px 0 20px rgba(0,0,0,0.2); overflow-y: auto; }
    .settings-panel.open { right: 0; }
    .settings-group { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .settings-group h3 { margin: 0 0 12px 0; font-size: 15px; color: var(--brand); }

    /* JSON зона */
    .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 30px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 12px; transition: 0.2s; }
    .drop-zone.dragover { border-color: var(--brand); background: rgba(37,99,235,0.1); }

    /* Балун карты */
    .popup-content h4 { margin: 0 0 6px; font-size: 15px; }
    .popup-content p { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
    .popup-actions { display: flex; gap: 6px; margin-top: 10px; }
    .popup-actions button { flex: 1; padding: 6px; font-size: 12px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .popup-actions button:hover { background: var(--border); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stops.js"></script>
</body>
</html>
