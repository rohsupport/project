<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Остановки — Управление</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Полноэкранный режим: скрываем меню и шапку */
    body.fullscreen .sidebar, 
    body.fullscreen .topbar { 
      display: none !important; 
    }
    body.fullscreen .main { 
      margin-left: 0 !important; 
      width: 100% !important;
    }
    body.fullscreen .content { 
      padding: 0 !important; 
      height: 100vh; 
      overflow: hidden; 
    }

    /* Вкладки */
    .tabs-container { 
      display: flex; 
      gap: 4px; 
      border-bottom: 1px solid var(--border); 
      margin-bottom: 16px; 
      background: var(--panel); 
      padding: 0 16px; 
    }
    .tab-btn { 
      background: transparent; 
      border: none; 
      color: var(--muted); 
      padding: 14px 20px; 
      cursor: pointer; 
      font-size: 14px; 
      font-weight: 600; 
      border-bottom: 2px solid transparent; 
      text-transform: uppercase; 
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }

    /* Сплит-экран 30/70 */
    .split-layout { 
      display: flex; 
      height: 100vh; 
      background: var(--bg); 
      overflow: hidden; 
      width: 100%;
    }
    .split-left { 
      flex: 0 0 30%; 
      padding: 24px; 
      overflow-y: auto; 
      background: var(--panel); 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
    }
    .split-right { 
      flex: 0 0 70%; 
      position: relative; 
      background: #e5e5e5; 
    }
    #map-add, #map-all { 
      width: 100% !important; 
      height: 100% !important; 
      z-index: 1; 
    }

    /* Таблица реестра */
    .table-wrapper { 
      background: var(--panel); 
      border: 1px solid var(--border); 
      border-radius: var(--radius); 
      overflow: hidden; 
      display: flex;
      flex-direction: column;
      height: calc(100vh - 200px);
    }
    .table-header { 
      padding: 12px; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      gap: 12px; 
      flex-wrap: wrap; 
      align-items: center; 
      background: rgba(0,0,0,0.1); 
    }
    .table-header select, .table-header input { 
      padding: 8px; 
      background: var(--bg); 
      color: var(--text); 
      border: 1px solid var(--border); 
      border-radius: 4px; 
      font-size: 13px; 
    }
    .table-scroll { 
      flex: 1;
      overflow-y: auto; 
    }
    .table-scroll table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
    }
    .table-scroll th { 
      position: sticky; 
      top: 0; 
      background: var(--panel); 
      z-index: 10; 
      padding: 10px; 
      text-align: left; 
      font-size: 11px; 
      color: var(--muted); 
      text-transform: uppercase; 
      border-bottom: 1px solid var(--border); 
    }
    .table-scroll td { 
      padding: 10px; 
      border-bottom: 1px solid rgba(255,255,255,0.05); 
      vertical-align: middle; 
    }
    .table-scroll tr:hover td { 
      background: rgba(37,99,235,0.05); 
    }

    /* Инлайн-статусы */
    .status-select {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      width: 100%;
      outline: none;
    }
    .status-select.active { background: rgba(22,163,74,0.15); color: #4ade80; border-color: rgba(22,163,74,0.3); }
    .status-select.reconstruction { background: rgba(245,158,11,0.15); color: #fbbf24; border-color: rgba(245,158,11,0.3); }
    .status-select.closed { background: rgba(220,38,38,0.15); color: #f87171; border-color: rgba(220,38,38,0.3); }

    /* Настройки */
    .settings-overlay { 
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 4000; 
      display: none; backdrop-filter: blur(2px); 
    }
    .settings-overlay.open { display: block; }
    .settings-panel { 
      position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; 
      background: var(--panel); border-left: 1px solid var(--border); 
      z-index: 4001; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      padding: 24px; box-shadow: -10px 0 30px rgba(0,0,0,0.5); overflow-y: auto; 
    }
    .settings-panel.open { right: 0; }
    .settings-close { 
      position: absolute; top: 15px; right: 15px; background: none; 
      border: none; color: var(--muted); font-size: 24px; cursor: pointer; 
    }
    .settings-close:hover { color: var(--err); }
    .settings-group { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .settings-group h3 { margin: 0 0 12px 0; font-size: 13px; color: var(--muted); text-transform: uppercase; }

    /* Форма */
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-group label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { 
      padding: 10px; background: var(--bg); color: var(--text); 
      border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { 
      outline: none; border-color: var(--brand); 
    }
    .form-group input[readonly] { background: rgba(255,255,255,0.05); color: var(--muted); cursor: not-allowed; }

    /* Импорт */
    .drop-zone { 
      border: 2px dashed var(--border); border-radius: 8px; padding: 40px; 
      text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 16px; transition: 0.2s; 
    }
    .drop-zone.dragover { border-color: var(--brand); background: rgba(37,99,235,0.1); color: var(--text); }
    .json-area { 
      width: 100%; height: 250px; font-family: monospace; font-size: 13px; 
      background: var(--bg); color: var(--text); border: 1px solid var(--border); 
      padding: 12px; border-radius: 8px; resize: vertical; 
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stops.js"></script>
</body>
</html>
