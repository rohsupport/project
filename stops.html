<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Остановки — Управление</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  
  <style>
    /* Строгий интерфейс */
    .nav-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .nav-tabs button { background: transparent; border: none; color: var(--muted); padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .nav-tabs button.active { color: var(--text); border-bottom-color: var(--brand); }
    .nav-tabs button:hover { color: var(--text); }

    /* Сплит-экран */
    .split-container { display: flex; height: calc(100vh - 160px); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; }
    .split-container.mirrored { flex-direction: row-reverse; }
    .split-panel { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
    .split-form-panel { flex: 0 0 30%; border-right: 1px solid var(--border); transition: flex-basis 0.1s; }
    .split-container.mirrored .split-form-panel { border-right: none; border-left: 1px solid var(--border); }
    .split-map-panel { flex: 1; padding: 0; }
    #main-map, #add-map { width: 100%; height: 100%; }

    /* Ресайзер */
    .resizer { width: 4px; background: var(--border); cursor: col-resize; z-index: 100; position: relative; }
    .resizer:hover { background: var(--brand); }

    /* Настройки */
    .settings-panel { position: fixed; top: 0; right: -350px; width: 350px; height: 100vh; background: var(--panel); border-left: 1px solid var(--border); z-index: 1000; transition: right 0.3s ease; padding: 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
    .settings-panel.open { right: 0; }
    .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
    .settings-overlay.open { display: block; }
    .settings-btn { position: fixed; bottom: 20px; right: 20px; z-index: 998; padding: 10px 16px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
    .settings-btn:hover { background: var(--border); }

    /* Таблица */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--brand); }
    th.sort-asc::after { content: ' (ASC)'; font-size: 10px; }
    th.sort-desc::after { content: ' (DESC)'; font-size: 10px; }
    input[readonly] { background: rgba(255,255,255,0.05); color: var(--muted); cursor: not-allowed; }

    /* Балун карты */
    .popup-content h4 { margin: 0 0 8px; font-size: 15px; }
    .popup-content p { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
    .popup-actions { display: flex; gap: 6px; margin-top: 10px; }
    .popup-actions button { flex: 1; padding: 6px; font-size: 12px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .popup-actions button:hover { background: var(--border); }
    .popup-actions button.del { border-color: var(--err); color: #fca5a5; }
    .popup-actions button.del:hover { background: rgba(220,38,38,0.2); }

    /* Drag and Drop */
    .drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 30px; text-align: center; color: var(--muted); cursor: pointer; transition: 0.2s; margin-bottom: 12px; }
    .drop-zone.dragover { border-color: var(--brand); background: rgba(37,99,235,0.1); color: var(--text); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stops.js"></script>
</body>
</html>
