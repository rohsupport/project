<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Остановки — Управление транспортом</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Общая сетка экрана */
    .workspace-grid {
      display: grid;
      grid-template-columns: 45% 1fr;
      gap: 16px;
      height: calc(100vh - 160px);
      min-height: 600px;
    }

    /* Левая панель */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
      overflow: hidden;
    }

    /* Форма добавления */
    .add-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      flex-shrink: 0;
    }
    .add-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .add-form .full-width { grid-column: span 2; }
    .add-form .field { margin: 0; }
    .add-form input, .add-form select { padding: 8px; font-size: 13px; }

    /* Реестр */
    .list-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .list-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .list-scroll {
      flex: 1;
      overflow-y: auto;
    }
    .list-scroll table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .list-scroll th { position: sticky; top: 0; background: var(--panel); z-index: 10; padding: 8px; text-align: left; font-size: 11px; color: var(--muted); }
    .list-scroll td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .list-scroll tr:hover td { background: rgba(37,99,235,0.05); }

    /* Карта */
    .map-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }
    #main-map { width: 100%; height: 100%; z-index: 1; }

    /* Настройки */
    .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; }
    .settings-overlay.open { display: block; }
    .settings-panel { position: fixed; top: 0; right: -350px; width: 350px; height: 100vh; background: var(--panel); border-left: 1px solid var(--border); z-index: 2001; transition: right 0.3s; padding: 20px; box-shadow: -5px 0 20px rgba(0,0,0,0.3); overflow-y: auto; }
    .settings-panel.open { right: 0; }
    .settings-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; line-height: 1; }
    .settings-close:hover { color: var(--text); }
    
    .settings-group { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .settings-group h3 { margin: 0 0 12px 0; font-size: 14px; color: var(--muted); text-transform: uppercase; }
    
    /* Балун карты */
    .popup-content h4 { margin: 0 0 6px; font-size: 15px; }
    .popup-content p { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
    .popup-actions { display: flex; gap: 6px; margin-top: 10px; }
    .popup-actions button { flex: 1; padding: 6px; font-size: 12px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .popup-actions button:hover { background: var(--border); }
    .popup-actions button.del { border-color: var(--err); color: #fca5a5; }

    /* Модалка импорта */
    dialog.modal { width: min(700px, 95vw); }
    .json-area { width: 100%; height: 250px; font-family: monospace; font-size: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 8px; resize: vertical; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stops.js"></script>
</body>
</html>
