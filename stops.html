<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Остановки — Управление транспортом</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  
  <style>
    /* Полноэкранный режим: 30% форма, 70% карта */
    .fullscreen-add {
      display: flex;
      height: calc(100vh - 120px); /* Высота за вычетом шапки */
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .fullscreen-form-col {
      flex: 0 0 30%;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .fullscreen-map-col {
      flex: 1;
      position: relative;
    }
    #page-map { width: 100%; height: 100%; }

    /* Таблица сортировки */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--brand); }
    th.sortable::after { content: ' ↕'; font-size: 10px; opacity: 0.3; }
    th.sort-asc::after { content: ' ↑'; opacity: 1; color: var(--brand); }
    th.sort-desc::after { content: ' ↓'; opacity: 1; color: var(--brand); }

    /* Мелкий список добавленных */
    .recent-box { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 12px; }
    .recent-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stops.js"></script>
</body>
</html>
