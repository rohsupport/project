<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Остановки — Управление транспортом</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  
  <style>
    /* Сетка: 1/3 форма, 2/3 карта */
    .stops-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 16px;
      height: calc(100vh - 140px);
      min-height: 600px;
    }
    .stops-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .stops-map-wrapper {
      position: relative;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    #main-map { width: 100%; height: 100%; }
    
    /* Скроллбар для панели */
    .stops-panel::-webkit-scrollbar { width: 6px; }
    .stops-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* JSON-редактор */
    .json-textarea {
      width: 100%;
      height: 150px;
      font-family: monospace;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      resize: vertical;
    }
    .json-textarea.error { border-color: var(--err); }

    /* Компактный список последних добавленных */
    .recent-list { display: flex; flex-direction: column; gap: 8px; }
    .recent-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid var(--border); 
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
    }
    .recent-code { font-family: monospace; font-weight: bold; color: var(--muted); }

    @media (max-width: 900px) {
      .stops-layout { grid-template-columns: 1fr; height: auto; }
      .stops-map-wrapper { height: 300px; order: -1; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stops.js"></script>
</body>
</html>
