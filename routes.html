<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Создание маршрута — Мастер</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    .wizard-wrapper { max-width: 1100px; margin: 0 auto; background: var(--panel); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; height: calc(100vh - 120px); overflow: hidden; }
    .wizard-top { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.1); }
    .wizard-title { margin: 0; font-size: 20px; }
    .wizard-steps { display: flex; gap: 8px; }
    .step-indicator { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); font-weight: bold; }
    .step-indicator.active .step-num { background: var(--brand); color: white; border-color: var(--brand); }
    .step-indicator.done .step-num { background: #16a34a; color: white; border-color: #16a34a; }
    
    .wizard-content { flex: 1; padding: 24px; overflow-y: auto; background: var(--bg); position: relative; }
    .wizard-step { display: none; height: 100%; }
    .wizard-step.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .wizard-bottom { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; background: var(--panel); }

    /* Шаг 2 */
    .step2-flex { display: flex; gap: 20px; height: 100%; }
    .step2-map { flex: 1; min-height: 400px; border-radius: var(--radius); border: 1px solid var(--border); position: relative; }
    #map { position: absolute; inset: 0; z-index: 1; }
    .step2-stops { flex: 0 0 400px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow: hidden; }
    
    .tab-nav { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: none; border: none; padding: 8px 16px; color: var(--muted); cursor: pointer; border-radius: 4px; font-weight: 600; }
    .tab-btn.active { background: var(--brand); color: white; }
    
    .add-stop-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-stop-box select { flex: 1; padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }

    .stops-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .stop-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 6px; cursor: grab; }
    .stop-row.dragging { opacity: 0.5; border: 1px dashed var(--brand); }
    .stop-time-input { width: 50px; padding: 4px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 4px; text-align: center; font-size: 12px; }

    /* Шаг 3 */
    .schedule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .days-box { display: flex; gap: 8px; flex-wrap: wrap; }
    .day-label { background: var(--panel); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .day-label input { cursor: pointer; }

    /* Шаг 4 */
    .fare-grid { display: flex; flex-direction: column; gap: 16px; }
    .fare-type { display: flex; gap: 16px; background: var(--panel); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
    .fare-matrix { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .fare-matrix th, .fare-matrix td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
    .fare-matrix input { width: 100px; padding: 6px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
  </style>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    // Этот скрипт вставит наш мастер в оболочку сайта
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.Auth) await window.Auth.requireStaff();
      const content = UI.renderShell({ title: 'Новый маршрут', profile: window.currentProfile, active: 'routes.html' });
      
      content.innerHTML = `
        <div class="wizard-wrapper">
          <div class="wizard-top">
            <h2 class="wizard-title">Создание нового маршрута</h2>
            <div class="wizard-steps">
              <div class="step-indicator active" id="ind-1"><span class="step-num">1</span> Основное</div>
              <div class="step-indicator" id="ind-2"><span class="step-num">2</span> Остановки</div>
              <div class="step-indicator" id="ind-3"><span class="step-num">3</span> Расписание</div>
              <div class="step-indicator" id="ind-4"><span class="step-num">4</span> Тарифы</div>
            </div>
          </div>
          
          <div class="wizard-content">
            <!-- Шаг 1 -->
            <div class="wizard-step active" id="step-1">
              <div style="max-width: 500px;">
                <div class="field" style="margin-bottom:16px;">
                  <label>Код маршрута *</label>
                  <input id="f-code" placeholder="Например: А-5" />
                </div>
                <div class="field" style="margin-bottom:16px;">
                  <label>Название *</label>
                  <input id="f-name" placeholder="Вокзал - Центр" />
                </div>
                <div class="field" style="margin-bottom:16px; display:flex; gap:8px; align-items:center;">
                  <input type="checkbox" id="f-transit" />
                  <label style="margin:0;">Проходящий маршрут (транзит)</label>
                </div>
              </div>
            </div>

            <!-- Шаг 2 -->
            <div class="wizard-step" id="step-2">
              <div class="step2-flex">
                <div class="step2-map"><div id="map"></div></div>
                <div class="step2-stops">
                  <div class="tab-nav">
                    <button class="tab-btn active" data-dir="forward">Туда</button>
                    <button class="tab-btn" data-dir="backward">Обратно</button>
                  </div>
                  <div class="add-stop-box">
                    <select id="select-stop"></select>
                    <button class="btn btn--brand" id="btn-add-stop">Добавить</button>
                  </div>
                  <div class="stops-scroll" id="stops-container"></div>
                </div>
              </div>
            </div>

            <!-- Шаг 3 -->
            <div class="wizard-step" id="step-3">
              <div class="schedule-grid">
                <div class="field">
                  <label>Время начала (06:00)</label>
                  <input type="time" id="s-start" value="06:00" />
                </div>
                <div class="field">
                  <label>Время окончания (22:00)</label>
                  <input type="time" id="s-end" value="22:00" />
                </div>
                <div class="field">
                  <label>Интервал (минут)</label>
                  <input type="number" id="s-interval" value="15" min="5" />
                </div>
              </div>
              
              <div class="field" style="margin-bottom:24px;">
                <label style="margin-bottom:8px; display:block;">Дни курсирования</label>
                <div class="days-box">
                  <label class="day-label"><input type="checkbox" class="day-checkbox" value="1" checked /> Пн</label>
                  <label class="day-label"><input type="checkbox" class="day-checkbox" value="2" checked /> Вт</label>
                  <label class="day-label"><input type="checkbox" class="day-checkbox" value="3" checked /> Ср</label>
                  <label class="day-label"><input type="checkbox" class="day-checkbox" value="4" checked /> Чт</label>
                  <label class="day-label"><input type="checkbox" class="day-checkbox" value="5" checked /> Пт</label>
                  <label class="day-label"><input type="checkbox" class="day-checkbox" value="6" /> Сб</label>
                  <label class="day-label"><input type="checkbox" class="day-checkbox" value="7" /> Вс</label>
                </div>
              </div>

              <h3 style="font-size:16px; margin-bottom:12px;">Время в пути по остановкам</h3>
              <div id="schedule-stops-container" style="background:var(--panel); padding:16px; border-radius:8px; border:1px solid var(--border);"></div>
            </div>

            <!-- Шаг 4 -->
            <div class="wizard-step" id="step-4">
              <div class="fare-grid">
                <div class="fare-type">
                  <label style="display:flex; gap:6px; align-items:center;"><input type="radio" name="fare-type" value="flat" checked /> Единая цена по городу</label>
                  <label style="display:flex; gap:6px; align-items:center;"><input type="radio" name="fare-type" value="stop_based" /> Цена по остановкам</label>
                </div>
                
                <div id="fare-flat-box" style="background:var(--panel); padding:16px; border-radius:8px; border:1px solid var(--border);">
                  <div class="field"><label>Стоимость проезда (руб)</label><input type="number" id="f-base-price" value="50" /></div>
                </div>

                <div id="fare-stop-box" style="display:none; background:var(--panel); padding:16px; border-radius:8px; border:1px solid var(--border); overflow-y:auto; max-height:400px;">
                  <table class="fare-matrix">
                    <thead><tr><th>Откуда</th><th>Куда</th><th>Цена</th></tr></thead>
                    <tbody id="fare-table-body"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <div class="wizard-bottom">
            <button class="btn" id="btn-prev" style="display:none;">← Назад</button>
            <div style="flex:1;"></div>
            <button class="btn btn--brand" id="btn-next">Далее →</button>
            <button class="btn btn--brand" id="btn-save" style="display:none;">Сохранить маршрут</button>
          </div>
        </div>
      `;
      
      // Загружаем логику мастера
      const script = document.createElement('script');
      script.src = 'js/routes-wizard.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
