<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мастер создания маршрута</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Стили для мастера */
    .wizard-container { max-width: 1200px; margin: 0 auto; height: calc(100vh - 100px); display: flex; flex-direction: column; }
    .wizard-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .steps-indicator { display: flex; gap: 12px; }
    .step-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--muted); border: 2px solid var(--border); }
    .step-dot.active { background: var(--brand); color: white; border-color: var(--brand); }
    .step-dot.done { background: #16a34a; color: white; border-color: #16a34a; }
    
    .wizard-body { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg); position: relative; }
    .wizard-step { display: none; height: 100%; }
    .wizard-step.active { display: flex; flex-direction: column; }
    
    .wizard-footer { display: flex; justify-content: space-between; padding: 16px; background: var(--panel); border-top: 1px solid var(--border); }

    /* Шаг 2: Карта и Список */
    .step2-layout { display: flex; gap: 16px; height: 100%; }
    .step2-map { flex: 1; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); position: relative; }
    #map-container { width: 100%; height: 100%; min-height: 500px; position: absolute; inset: 0; z-index: 1; }
    .step2-sidebar { flex: 0 0 400px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    
    /* Список остановок Drag & Drop */
    .stop-list-container { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg); }
    .stop-item-drag {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 6px; margin-bottom: 8px; cursor: grab;
    }
    .stop-item-drag.dragging { opacity: 0.5; border: 2px dashed var(--brand); }
    .stop-item-drag .drag-handle { color: var(--muted); cursor: grab; padding: 0 8px; font-size: 18px; }
    .stop-item-drag .travel-time { width: 60px; padding: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; text-align: center; }
    .tab-buttons { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600; }
    .tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }

    /* Таблицы */
    .price-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .price-table th, .price-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .price-table input, .price-table select { padding: 6px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; width: 100%; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/routes-wizard.js"></script>
</body>
</html>
