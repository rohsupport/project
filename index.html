<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Афиша Тюмень — что сегодня вечером</title>
<meta name="description" content="Афиша Тюмени: события, концерты, спектакли, выставки. Что сегодня вечером — за 30 секунд.">
<meta property="og:title" content="Афиша Тюмень" id="og-title">
<meta property="og:description" content="Что сегодня в Тюмени" id="og-desc">
<meta property="og:image" content="" id="og-img">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#171a20;--muted:#6b7280;--line:#e4e6eb;--acc:#e8590c;--acc-soft:#fff0e6;--blue:#1c7ed6;--ok:#2f9e44;--warn:#f08c00;--bad:#e03131;--r:14px;--sh:0 1px 3px rgba(0,0,0,.08);--pad:16px}
[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--text:#e9ecef;--muted:#8b929c;--line:#262a33;--acc-soft:#3a2010;--sh:0 1px 3px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--pad)}
/* HEADER */
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:6px;height:56px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.3px;white-space:nowrap;margin-right:14px}
.logo b{color:var(--acc)}
.navlink{padding:8px 12px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap}
.navlink:hover{background:var(--bg)}
.navlink.on{color:var(--text);font-weight:600;background:var(--acc-soft)}
.topbar .spacer{flex:1}
.icobtn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;position:relative}
.icobtn:hover{background:var(--bg)}
.favcount{position:absolute;top:2px;right:0;background:var(--acc);color:#fff;font-size:10px;border-radius:9px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;color:var(--muted);position:relative}
.tabbar a.on{color:var(--acc);font-weight:600}
.tabbar .favcount{top:0}
@media(max-width:820px){.topbar .navlinks{display:none}.tabbar{display:flex}.page{padding-bottom:76px}}
/* CARDS */
.sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}
.row-card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh);align-items:center;cursor:pointer;position:relative;transition:transform .1s}
.row-card:active{transform:scale(.985)}
.time-cell{width:56px;flex-shrink:0;text-align:center}
.time-cell .t{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:700}
.time-cell .d{font-size:11px;color:var(--muted)}
.card-mid{flex:1;min-width:0}
.card-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.d0{background:var(--ok)}.d1{background:var(--blue)}.d2{background:var(--warn)}.d3{background:var(--bad)}
.warn-badge{margin-top:5px;font-size:12px;color:var(--warn);background:rgba(240,140,0,.12);border-radius:7px;padding:2px 7px;display:inline-block}
.fav-btn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;color:var(--muted)}
.fav-btn.onf{color:var(--acc)}
/* CHIPS */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;flex-shrink:0}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stat-line{font-size:13.5px;color:var(--muted);margin-top:6px}
.stat-line b{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14.5px}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.hero{padding:26px 0 4px}
.hero h1{font-size:26px;letter-spacing:-.5px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:820px){.grid2{grid-template-columns:repeat(4,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:820px){.grid3{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer}
.tile .ph{aspect-ratio:4/3;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;font-size:40px}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .tb{padding:10px 12px}
.tile .tb .t{font-weight:600;font-size:14.5px}
/* WEEK GRID */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.wday{min-width:120px}
.wday .hd{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px}
.wcell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:64px;margin-bottom:6px;font-size:12px;cursor:pointer}
.wcell .tt{font-family:ui-monospace,monospace;font-weight:700}
.wcell .nm{color:var(--muted)}
.wcell.empty{opacity:.35;justify-content:center;display:flex;align-items:center}
/* DETAIL */
.dg{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;font-size:60px}
.dg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dg .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center;z-index:2}
.dg .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.dg .dots i.on{background:#fff}
.sticky-buy{position:fixed;bottom:64px;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:10px var(--pad);display:flex;align-items:center;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
@media(min-width:820px){.sticky-buy{position:static;box-shadow:none;border:1px solid var(--line);border-radius:var(--r);padding:14px}}
.price-big{font-size:20px;font-weight:800;white-space:nowrap}
.detail-meta{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.map-mini{height:170px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
/* FORMS */
.form{display:flex;flex-direction:column;gap:14px;max-width:520px}
.form label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.hint{font-size:12.5px;color:var(--muted)}
.private-note{background:var(--acc-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:6px}
.keybox{font-family:ui-monospace,monospace;font-size:24px;letter-spacing:4px;text-align:center;background:var(--card);border:2px dashed var(--acc);border-radius:var(--r);padding:18px 10px;font-weight:700;word-break:break-all}
.badge{display:inline-block;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:600}
.b-pending{background:rgba(28,126,214,.15);color:var(--blue)}
.b-approved{background:rgba(47,158,68,.15);color:var(--ok)}
.b-rejected{background:rgba(224,49,49,.13);color:var(--bad)}
.b-needs_info{background:rgba(240,140,0,.16);color:var(--warn)}
.b-frozen,.b-blocked,.b-spam{background:rgba(107,114,128,.16);color:var(--muted)}
.status-note{border-radius:10px;padding:11px 13px;font-size:14px;margin:10px 0}
.sn-info{background:rgba(240,140,0,.12)}
.sn-bad{background:rgba(224,49,49,.1)}
.sn-ok{background:rgba(47,158,68,.1)}
/* CHAT */
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:10px;background:var(--bg);border-radius:10px;margin:10px 0}
.bubble{max-width:80%;padding:8px 12px;border-radius:13px;font-size:14px}
.bubble.mod{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bubble.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px}
.bubble .tm{font-size:10.5px;opacity:.7;margin-top:3px}
.chat-in{display:flex;gap:8px}
/* ADMIN */
.adm-shell{display:flex;min-height:100vh}
.adm-side{width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.adm-side .logo{display:block;margin-bottom:12px}
.side-gr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 5px}
.side-l{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;font-size:14px;color:var(--muted)}
.side-l:hover{background:var(--bg);color:var(--text)}
.side-l.on{background:var(--acc-soft);color:var(--text);font-weight:600}
.side-l .cnt{background:var(--acc);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px}
.adm-main{flex:1;padding:20px;min-width:0}
@media(max-width:820px){.adm-shell{flex-direction:column}.adm-side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}.side-gr{width:100%}.side-l{padding:7px 10px;font-size:13px}.adm-main{padding:12px}}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;font-size:13.5px}
.tbl th{text-align:left;padding:10px;background:var(--bg);color:var(--muted);font-size:12px;text-transform:uppercase}
.tbl td{padding:10px;border-top:1px solid var(--line)}
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
@media(min-width:700px){.stat-cards{grid-template-columns:repeat(4,1fr)}}
.stat-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat-c .v{font-size:24px;font-weight:800}
.stat-c .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin:12px 0}
.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars i span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.barrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.barrow .bw{flex:1;height:8px;background:var(--bg);border-radius:5px;overflow:hidden}
.barrow .bf{height:100%;background:var(--acc);border-radius:5px}
.barrow .bl{width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bv{width:60px;text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.chk input{width:auto}
/* MISC */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:16px;max-width:420px;width:100%;padding:20px;max-height:86vh;overflow-y:auto}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#21252c;color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#viewer{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
.doc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.doc-card .di{font-size:22px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:8px;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}
.fade{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero-count{color:var(--muted);font-size:14px;margin-bottom:14px}
.hero-count b{color:var(--text)}
h1.pg{font-size:22px;margin:18px 0 4px}
.backl{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;padding:12px 0}
mark{background:#ffe066;color:inherit;border-radius:3px;padding:0 2px}
[data-theme="dark"] mark{background:#8a6d00;color:#fff}
.leaflet-container{font-family:inherit}
.switch{position:relative;width:44px;height:25px;border-radius:13px;background:var(--line);transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--acc)}
.switch.on::after{left:22px}
.search-top{position:sticky;top:56px;z-index:30;background:var(--bg);padding:10px 0}
.footer{margin:40px 0 20px;color:var(--muted);font-size:13px;text-align:center}
.banner{background:var(--acc-soft);border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
</style>
</head>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="viewer" onclick="this.style.display='none'"><img id="viewer-img"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
"use strict";
/* ============ 0. КОНФИГ ============ */
const CFG_KEY='afisha:cfg';
const CFG=Object.assign({supabaseUrl:'',supabaseKey:'',ownerEmail:'owner@afisha-tumen.ru',imgFmt:'4:3',imgW:1200,imgQ:82,seoTitle:'Афиша Тюмень — что сегодня вечером',seoDesc:'Афиша Тюмени: события на сегодня и выходные',apiOn:false},LS.get(CFG_KEY,{}));
const SB=(CFG.supabaseUrl&&CFG.supabaseKey&&window.supabase)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey):null;
const MODE=SB?'supabase':'local';
/* ============ 1. УТИЛИТЫ ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'v-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const pad2=n=>String(n).padStart(2,'0');
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
function fmtDT(iso){if(!iso)return'—';const d=new Date(iso);return d.getDate()+' '+MONTHS[d.getMonth()]+', '+WD[d.getDay()]+' · '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmtTime(iso){const d=new Date(iso);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmtDayLabel(d){return d.getDate()+' '+MONTHS[d.getMonth()];}
function sameDay(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate();}
function dayOffset(n){const d=new Date();d.setDate(d.getDate()+n);return d;}
function priceDot(p){return p===0?['🟢','бесплатно','d0']:p<500?['🔵','до 500 ₽','d1']:p<1500?['🟠','500–1500 ₽','d2']:['🔴','1500+ ₽','d3'];}
function priceTxt(p){if(p===0)return'Бесплатно';return p+' ₽';}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600);}
function copyTxt(t){navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Скопировано')):(()=>{const i=document.createElement('textarea');i.value=t;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove();toast('Скопировано');})();}
function genKey(){let k='';for(let i=0;i<12;i++)k+=Math.floor(Math.random()*10);if(k[0]==='0')k='9'+k.slice(1);return k;}
function zeroNum(n,w){return String(n).padStart(w,'0');}
function icsFor(ev){const dt=s=>new Date(s).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Afisha Tyumen//RU','BEGIN:VEVENT','UID:'+ev.id+'@afisha','DTSTART:'+dt(ev.start_at),'DTEND:'+dt(ev.end_at||ev.start_at),'SUMMARY:'+ev.title,'LOCATION:'+venueName(ev.venue_id),'DESCRIPTION:'+(ev.description||'').slice(0,200),'END:VEVENT','END:VCALENDAR'].join('\r\n');}
function download(name,content,mime){const b=new Blob([content],{type:mime||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
function ymapsRoute(addr){window.open('https://yandex.ru/maps/?text='+encodeURIComponent('Тюмень, '+addr),'_blank');}
function setOG(t,d,i){const el=id=>document.getElementById(id);if(el('og-title'))el('og-title').content=t;if(el('og-desc'))el('og-desc').content=d;if(el('og-img'))el('og-img').content=i||'';document.title=t;}
function LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
/* IndexedDB очередь аналитики */
const idb={db:null,
 open(){return new Promise(res=>{const r=indexedDB.open('afisha',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('q',{autoIncrement:true});r.onsuccess=e=>{idb.db=e.target.result;res()};r.onerror=()=>res();});},
 async add(ev){if(idb.db){const tx=idb.db.transaction('q','readwrite');tx.objectStore('q').add(ev);}else{const q=LS.get('afisha:q',[]);q.push(ev);LS.set('afisha:q',q);}},

function applyTheme(){const t=theme();const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',dark?'dark':'light');}
function cycleTheme(){const order=['light','dark','auto'];const t=theme();LS.set('afisha:theme',order[(order.indexOf(t)+1)%3]);applyTheme();toast('Тема: '+({light:'светлая',dark:'тёмная',auto:'авто'})[theme()]);}
function groupByDay(events){const g={};events.forEach(ev=>{const d=new Date(ev.start_at);const key=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());(g[key]=g[key]||[]).push(ev);});return Object.keys(g).sort().map(k=>({key:k,label:null,events:g[k]}));}
function dayLabel(key){const d=new Date(key+'T12:00:00');const today=new Date();const tom=dayOffset(1);if(sameDay(d,today))return 'Сегодня, '+fmtDayLabel(d);if(sameDay(d,tom))return 'Завтра, '+fmtDayLabel(d);return fmtDayLabel(d)+', '+WD[d.getDay()];}
function evCard(ev,compact){const t=fmtTime(ev.start_at);const day=WD[new Date(ev.start_at).getDay()];const [dot,,dc]=priceDot(ev.price);const low=ev.tickets_left!=null&&ev.tickets_left<=10&&ev.tickets_left>0;return '<div class="row-card fade" data-ev="'+ev.id+'" data-track="card:'+esc(ev.title)+'"><div class="time-cell"><div class="t">'+t+'</div><div class="d">'+day+'</div></div><div class="card-mid"><div class="card-title">'+esc(ev.title)+'</div><div class="card-sub">'+esc(venueName(ev.venue_id))+' · '+catById(ev.category_id).icon+' '+esc(catById(ev.category_id).name)+' · <span class="price-dot '+dc+'"></span>'+esc(priceTxt(ev.price))+'</div>'+(low?'<div class="warn-badge">⚠ Осталось '+ev.tickets_left+' билетов</div>':'')+'</div><button class="fav-btn '+(isFav(ev.id)?'onf':'')+'" data-fav="'+ev.id+'">'+(isFav(ev.id)?'♥':'♡')+'</button></div>';}
function chipBar(items,activeId,cb){return '<div class="chips">'+items.map(i=>'<button class="chip '+(i.id===activeId?'on':'')+'" data-chip="'+i.id+'">'+esc(i.label)+'</button>').join('')+'</div>';}

const HOME_TABS=[{id:'today',label:'Сегодня'},{id:'tomorrow',label:'Завтра'},{id:'weekend',label:'Выходные'},{id:'week',label:'Неделя'},{id:'all',label:'Все'}];
let homeState={tab:'today',chip:null};
async function pageHome(){
 setOG('Афиша Тюмень — что сегодня вечером','События Тюмени на сегодня и выходные','');
 let cats=window.__cats;
 $('#app').innerHTML=shell('<div class="hero"><h1>Что сегодня в Тюмени</h1><div class="hero-count" id="hc">…</div>'+chipBar(HOME_TABS,homeState.tab)+chipBar(cats.map(c=>({id:'cat'+c.id,label:c.icon+' '+c.name})),homeState.chip)+'</div><div id="home-list"></div><p style="text-align:center;margin:16px 0"><a class="btn" href="#/all">Показать все события →</a></p>','#/');
 const all=await SQ.events();window.__eventsCache=all;
 renderHomeList(all);
}
function homeFilter(all){
 const t=homeState.tab;const today=new Date();
 return all.filter(ev=>{if(ev.status!=='published')return false;const d=new Date(ev.start_at);const dow=d.getDay();
 if(t==='today'&&!sameDay(d,today))return false;
 if(t==='tomorrow'&&!sameDay(d,dayOffset(1)))return false;
 if(t==='weekend'&&!(dow===6||dow===0))return false;
 if(t==='week'&&d<new Date(today.getFullYear(),today.getMonth(),today.getDate())||t==='week'&&d>dayOffset(7))return false;
 if(t==='all'&&d<new Date(Date.now()-3*3600000))return false;
 if(homeState.chip==='free')return ev.price===0;
 if(homeState.chip==='kids')return ev.age_limit==='0+'||ev.age_limit==='6+';
 if(homeState.chip&&String(homeState.chip).startsWith('cat'))return ev.category_id===Number(homeState.chip.slice(3));
 return true;});
}
function renderHomeList(all){
 const list=homeFilter(all).sort((a,b)=>new Date(a.start_at)-new Date(b.start_at));
 const today=list.filter(ev=>sameDay(new Date(ev.start_at),new Date()));
 const free=today.filter(ev=>ev.price===0);
 const evening=list.filter(ev=>sameDay(new Date(ev.start_at),new Date())&&new Date(ev.start_at).getHours()>=18);
 $('#hc').innerHTML='<b>'+today.length+'</b> сегодня · <b>'+free.length+'</b> бесплатных · <b>'+evening.length+'</b> после 18:00';
 let h='';
 if(!list.length)h='<div class="empty"><div class="big">🎭</div>Пока пусто<br>События скоро появятся</div>';
 else if(homeState.tab==='today'&&homeState.chip==='free'&&free.length===0)h='<div class="empty"><div class="big">🎁</div>Бесплатных событий сегодня нет<br>Загляните на выходные</div>';
 else if(homeState.tab==='weekend'&&homeState.tab==='weekend'&&['weekend'].includes(homeState.tab)){const we=list.filter(ev=>{const dow=new Date(ev.start_at).getDay();return dow===6||dow===0;});const wk=list.filter(ev=>!we.includes(ev));h=grp(wk,'Будни')+grp(we,'Выходные');}
 else{h=groupByDay(list).map(g=>grp(g.events,dayLabel(g.key))).join('');}
 if(homeState.tab==='weekend'){const we=list.filter(ev=>{const dow=new Date(ev.start_at).getDay();return dow===6||dow===0;});const wk=list.filter(ev=>!we.includes(ev));h=grp(wk,'Будни')+grp(we,'Выходные');}
 $('#home-list').innerHTML=h;
}
function grp(events,label){if(!events.length)return'';return '<div class="sec-title">── '+esc(label)+' ──</div>'+events.map(ev=>evCard(ev)).join('');}
document.addEventListener('click',e=>{
 const t=e.target;
 const chip=t.closest('[data-chip]');
 if(chip){const id=chip.dataset.chip;const tb=chip.closest('.hero');
 if(HOME_TABS.some(x=>String(x.id)===id)){homeState.tab=id;homeState.chip=null;track('filter',{tab:id});$$('.hero .chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.chip===id));if(window.__eventsCache)renderHomeList(window.__eventsCache);}
 else{homeState.chip=homeState.chip===id?null:id;track('filter',{chip:id});$$('.hero .chips').forEach(cc=>cc.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.chip===homeState.chip)));if(window.__eventsCache)renderHomeList(window.__eventsCache);}
 return;}
 const fb=t.closest('[data-fav]');if(fb){e.stopPropagation();const id=fb.dataset.fav;const on=toggleFav(id);fb.classList.toggle('onf',!on);fb.textContent=on?'♡':'♥';toast(on?'Убрано из избранного':'Сохранено в избранное');return;}

});

async function catApply(isMap){
 const all=await SQ.events();window.__eventsCache=all;
 let list=all.filter(ev=>ev.status==='published');
 if(catState.archive)list=list.filter(ev=>new Date(ev.start_at)<new Date());else list=list.filter(ev=>new Date(ev.start_at)>=new Date(Date.now()-3*3600000));

 if(t==='today')list=list.filter(ev=>sameDay(new Date(ev.start_at),today));

 if(catState.cat)list=list.filter(ev=>ev.category_id===catState.cat);
 if(catState.q)list=list.filter(ev=>(ev.title+' '+(ev.description||'')+' '+venueName(ev.venue_id)+' '+catById(ev.category_id).name).toLowerCase().includes(catState.q.toLowerCase()));
 list.sort((a,b)=>new Date(a.start_at)-new Date(b.start_at));

 if(isMap){$('#cat-body').innerHTML='<div id="catmap" style="height:60vh;border-radius:var(--r);overflow:hidden"></div>';drawLeaflet('catmap',list,true);$('#cat-more').style.display='none';return;}
 const show=list.slice(0,catState.shown);
 $('#cat-body').innerHTML=(t==='week'&&!catState.archive)?weekGrid(list):groupByDay(show).map(g=>grp(g.events,dayLabel(g.key))).join('')||'<div class="empty"><div class="big">🗓</div>Ничего не найдено</div>';
 $('#cat-more').style.display=list.length>catState.shown?'':'none';$('#cat-more').textContent='Показать ещё '+Math.min(12,list.length-catState.shown);
}
function weekGrid(list){

 return '<div class="sec-title">── Неделя, '+fmtDayLabel(days[0])+'–'+fmtDayLabel(days[6])+' ──</div><div class="week-grid">'+days.map(d=>{const evs=list.filter(ev=>sameDay(new Date(ev.start_at),d));return '<div class="wday"><div class="hd">'+WD[d.getDay()]+' '+d.getDate()+'</div>'+(evs.length?evs.slice(0,5).map(ev=>'<div class="wcell" data-ev="'+ev.id+'"><div class="tt">'+fmtTime(ev.start_at)+'</div><div class="nm">'+esc(ev.title.slice(0,26))+'</div></div>').join(''):'<div class="wcell empty">—</div>')+'</div>';}).join('')+'</div>';

function drawLeaflet(elId,list,withRibbon){
 if(!window.L){$('#'+elId).innerHTML='<div class="empty">Карта недоступна офлайн</div>';return;}
 const c=L.map(elId).setView([57.15,65.53],12);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(c);
 const cl=L.markerClusterGroup?L.markerClusterGroup():L.layerGroup();
 list.filter(ev=>venueById(ev.venue_id).lat).forEach(ev=>{const v=venueById(ev.venue_id);L.marker([v.lat,v.lng]).bindPopup('<b>'+esc(ev.title)+'</b><br>'+fmtDT(ev.start_at)+'<br>'+priceTxt(ev.price)+'<br><a href="#/event/'+ev.id+'">Открыть →</a>').addTo(cl);});
 c.addLayer(cl);setTimeout(()=>c.invalidateSize(),100);
 return c;
}

async function docsGateIfNeeded(role){
 const docs=await SQ.docs();
 const rel=role?docs.filter(d=>d.role===role&&d.required):docs.filter(d=>d.required&&d.show_on_start);
 if(!rel.length)return true;
 const accepted=LS.get('afisha:accept',[]);

 if(!need.length)return true;
 return new Promise(res=>{
 const d=openModal('<h2 style="margin-bottom:6px">Афиша Тюмень</h2><p class="hint" style="margin-bottom:12px">'+(role?'Чтобы продолжить, примите условия:':'Чтобы продолжить, примите:')+'</p>'+need.map(x=>'<div class="doc-card" onclick="window.open(\''+(x.url||'#/docs')+'\')"><div class="di">📄</div><div><b>'+esc(x.name)+'</b>'+(x.description?'<div class="hint">'+esc(x.description.slice(0,120))+'…</div>':'')+'</div></div>').join('')+'<label class="chk"><input type="checkbox" id="dg-accept"> Я принимаю</label><div style="display:flex;gap:10px;margin-top:14px"><button class="btn acc" id="dg-go" disabled style="opacity:.5">Войти</button><button class="btn" id="dg-out">Выйти</button></div>');
 d.querySelector('#dg-accept').onchange=e=>{const b=d.querySelector('#dg-go');b.disabled=!e.target.checked;b.style.opacity=e.target.checked?'1':'.5';};
 d.querySelector('#dg-go').onclick=()=>{LS.set('afisha:accept',accepted.concat(need.map(x=>x.id)));d.remove();res(true);};
 d.querySelector('#dg-out').onclick=()=>{d.remove();document.body.innerHTML='<div class="empty" style="padding-top:30vh"><div class="big">👋</div>Вы отказались от условий.<br>Вернуться: перезагрузите страницу.</div>';res(false);};
 });

 renderStatus(sub);
}
async function renderStatus(sub){window.__curSub=sub;
 const st=sub.status;const isOpen=st==='spam'?false:(st==='blocked'?false:st!=='rejected');
 const p=sub.payload||{};
 $('#app').innerHTML=shell('<a class="backl" href="#/status">← Назад</a><h1 class="pg">Статус заявки</h1>'
 +'<div class="row-card" style="cursor:default"><div class="card-mid"><div class="card-title">'+esc(p.title||'—')+' <span class="badge b-'+st+'">'+STATUS_NAMES[st]+'</span></div><div class="card-sub">Ключ: '+esc(sub.access_key)+'</div>'

 +(st==='rejected'?'<div class="status-note sn-bad">✕ Причина: '+esc(sub.moderator_notes||'не указана')+'</div><button class="btn" id="re-sub">Подать заново</button>':'')
 +(st==='frozen'?'<div class="status-note sn-info">⏸ Заявка приостановлена модератором. Чат открыт.</div>':'')
 +(st==='blocked'?'<div class="status-note sn-bad">🔒 Заблокировано.</div>':'')
 +(st==='spam'?'<div class="status-note">Заявка не найдена.</div>':'')
 +'</div></div>'
 +(p.start_at?'<div class="hint">Дата: '+fmtDT(p.start_at)+' · Место: '+esc(p.venue_text||'—')+' · Цена: '+esc(priceTxt(Number(p.price)||0))+'</div>':'')
 +((p.photos||[]).length?'<div class="chips">'+p.photos.map(u=>'<img class="chip" src="'+esc(u)+'" style="padding:0;height:60px;object-fit:cover;width:80px">').join('')+'</div>':'')
 +'<div class="chips" id="st-tabs">'+(st==='approved'?'<button class="chip on" data-tab="sub">Заявка и чат</button><button class="chip" data-tab="an">Аналитика</button>':'<span class="chip on">Заявка и чат</span>')+'</div>'
 +'<div id="st-body"></div>','#/');
 if(st==='rejected'){const b=$('#re-sub');if(b)b.onclick=()=>nav('#/submit');}
 if(st!=='spam'&&st!=='blocked')renderChat(sub,isOpen);
 else $('#st-body').innerHTML='<div class="empty">Чат недоступен</div>';
}
let chatChan=null;
async function renderChat(sub,canWrite){
 const msgs=await DB.msgs(sub.id);
 const el=document.createElement('div');
 el.innerHTML='<div class="sec-title">Чат с модератором</div><div class="chat" id="chat">'+msgs.map(m=>bubble(m)).join('')+'</div>'+(canWrite?'<div class="chat-in"><input id="msg-in" placeholder="Написать сообщение…"><button class="btn acc" id="msg-send">➤</button></div>':'<div class="hint">Чат в режиме чтения.</div>');
 $('#st-body').appendChild(el);
 const box=$('#chat');box.scrollTop=box.scrollHeight;
 if(SB&&chatChan)chatChan.unsubscribe();
 if(SB){chatChan=SB.channel('sub:'+sub.id).on('postgres_changes',{event:'*',schema:'public',table:'submission_messages',filter:'submission_id=eq.'+sub.id},async()=>{const mm=await DB.msgs(sub.id);$('#chat').innerHTML=mm.map(bubble).join('');$('#chat').scrollTop=$('#chat').scrollHeight;}).subscribe();}
 const send=()=>{const i=$('#msg-in');if(!i||!i.value.trim())return;DB.sendMsg(sub.id,'user',i.value.trim());i.value='';};
 if(canWrite){$('#msg-send').onclick=send;$('#msg-in').onkeydown=e=>{if(e.key==='Enter')send();};}
}
function bubble(m){return '<div class="bubble '+(m.author==='user'?'me':m.author==='system'?'sys':'mod')+'">'+(m.author==='system'?esc(m.body):'<b>'+(m.author==='user'?'Вы':'Модератор')+':</b> '+esc(m.body))+'<div class="tm">'+fmtTime(m.created_at)+'</div></div>';}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t){$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===t));if(t.dataset.tab==='an')renderSubAnalytics(t._sub||window.__curSub);else if(window.__curSub)renderSubChat(window.__curSub);}
});
let _curSub=null;
async function renderSubChat(sub){_curSub=sub;$('#st-body').innerHTML='';renderChat(sub,sub.status!=='rejected');}
async function renderSubAnalytics(sub){_curSub=sub;
 if(SB){const r=await SB.rpc('analytics_summary',{p_from:new Date(Date.now()-7*864e5).toISOString(),p_to:new Date().toISOString()});const s=r.data||{};
 $('#st-body').innerHTML='<div class="sec-title">Аналитика (7 дней)</div><div class="stat-cards"><div class="stat-c"><div class="v">'+(s.event_views||0)+'</div><div class="l">Просмотры</div></div><div class="stat-c"><div class="v">'+(s.uniques||0)+'</div><div class="l">Уникальные</div></div><div class="stat-c"><div class="v">'+(s.ticket_clicks||0)+'</div><div class="l">Клики</div></div><div class="stat-c"><div class="v">'+(s.event_views?Math.round((s.ticket_clicks||0)/s.event_views*100):0)+'%</div><div class="l">Конверсия</div></div></div><div class="banner">Расширенная аналитика — по запросу. Конструктор отчёта: откуда пришли, устройства, по дням, сравнение со средним, воронка. Оплата кодом активации.</div><button class="btn" onclick="toast(\'Расширенная аналитика — по запросу у модератора\')">📈 Расширенная аналитика</button>';return;}
 const evs=oneData('events',x=>x.pub_number===sub.pub_number);
 $('#st-body').innerHTML='<div class="sec-title">Аналитика (7 дней)</div><div class="stat-cards"><div class="stat-c"><div class="v">'+((evs&&evs.views)||Math.floor(Math.random()*400))+'</div><div class="l">Просмотры</div></div><div class="stat-c"><div class="v">'+((evs&&Math.round(evs.views*0.7))||0)+'</div><div class="l">Уникальные</div></div><div class="stat-c"><div class="v">'+((evs&&Math.round(evs.views*0.05))||0)+'</div><div class="l">Клики</div></div><div class="stat-c"><div class="v">5%</div><div class="l">Конверсия</div></div></div><div class="banner">Расширенная аналитика — по запросу (платно). Оплата кодом активации (12 цифр).</div>';
}
</script>

 ['СОДЕРЖИМОЕ',[['dash','Обзор'],['analytics','Аналитика'],['events','События'],['venues','Площадки'],['cats','Категории'],['media','Медиа']]],

 $('#adm-out').onclick=async()=>{if(SB)await SB.auth.signOut();ADMIN.user=null;ADMIN.email=null;LS.set('afisha:admin',null);nav('#/');};
 window.__cats=await SQ.cats();window.__venues=await SQ.venues();
 const views={'dash':admDash,'analytics':admAnalytics,'events':admEvents,'event':()=>admEventEditor(sub),'venues':admVenues,'cats':admCats,'media':admMedia,'mod':()=>admMod(sub),'ads':admAds,'ad':()=>admAdEditor(sub),'docs':admDocs,'settings':admSettings,'people':admPeople,'maint':()=>admMaint(sub)};
 (views[s]||admDash)();

/* ============ 21. ДАШБОРД ============ */
async function admDash(){
 const subs=await SQ.subs();const evs=await SQ.eventsAll();
 const pend=subs.filter(x=>x.status==='pending');const stale=pend.filter(x=>Date.now()-new Date(x.created_at)>86400000);
 const localQ=LS.get('afisha:q',[]);
 const views7=localQ.filter(x=>x.type==='entity_view').length;
 const clicks=localQ.filter(x=>x.type==='ticket_click').length;
 $('#adm-body').innerHTML='<h1 class="pg">Дашборд</h1><p class="hint">'+new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+' <button class="btn sm" onclick="admDash()">Обновить</button></p>'
 +'<div class="banner">⚠ Требует внимания<br>• '+pend.length+' заявок на модерации (>24 ч: '+stale.length+')<br>• 0 чатов без ответа<br>• '+(DEMO.campaigns.filter(c=>c.spent>c.budget).length)+' кампаний превысили бюджет</div>'
 +'<div class="stat-cards"><div class="stat-c"><div class="v">'+evs.filter(ev=>ev.status==='published'&&sameDay(new Date(ev.start_at),new Date())).length+'</div><div class="l">Сегодня</div></div><div class="stat-c"><div class="v">'+views7+'</div><div class="l">Просмотры</div></div><div class="stat-c"><div class="v">'+clicks+'</div><div class="l">Клики</div></div><div class="stat-c"><div class="v">'+pend.length+'</div><div class="l">Заявки</div></div></div>'
 +'<div class="sec-title">Быстрые действия</div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/admin/event/new">+ Событие</a><a class="btn" href="#/admin/ad/new">+ Кампания</a><a class="btn" href="#/admin/mod">Открыть модерацию</a></div>'
 +'<div class="sec-title">Последние заявки</div>'+subs.slice(0,4).map(x=>'<div class="list-item" onclick="nav(\'#/admin/mod/'+x.id+'\')"><span>№'+zeroNum(x.id,12)+' · '+esc((x.payload||{}).title||'—')+'</span><span><span class="badge b-'+x.status+'">'+STATUS_NAMES[x.status]+'</span></span></div>').join('')+'<p><a class="btn sm" href="#/admin/mod">Все заявки →</a></p>';
}
/* ============ 22. АНАЛИТИКА АДМИНА ============ */
async function admAnalytics(){
 const period=window.__anP||7;const from=new Date(Date.now()-period*864e5).toISOString();const to=new Date().toISOString();
 let data={views:0,sessions:0,uniques:0,byDay:{},top:[],devices:{},sources:{},hours:new Array(24).fill(0),searches:{}};
 if(SB){const r=await SB.rpc('analytics_summary',{p_from:from,p_to:to});const d=r.data||{};data.views=d.page_views||0;data.sessions=d.sessions||0;data.uniques=d.uniques||0;}
 const q=await localEvents();const evs=window.__evCache=q;
 // локальные события поведения из idb/ls
 let be=[];if(idb.db){be=await new Promise(res=>{const rq=idb.db.transaction('q').objectStore('q').getAll();rq.onsuccess=()=>res(rq.result);});}else be=LS.get('afisha:q',[]);
 const per=x=>!x.ts||new Date(x.ts)>=new Date(from);
 const views=[...be,...LS.get('afisha:hist',[]).map(x=>({type:'entity_view',ts:x.ts,target_id:x.id}))].filter(x=>per(x)&&x.type==='entity_view');
 const sessions=new Set(be.filter(per).map(x=>x.session_id));const uniques=new Set(be.filter(per).map(x=>x.visitor_id));
 const byDay={},dev={m:0,d:0,t:0},src={},hrs=new Array(24).fill(0),srch={};
 be.filter(per).forEach(x=>{if(!x.ts)return;const dd=x.ts.slice(0,10);if(x.type==='entity_view'){byDay[dd]=(byDay[dd]||0)+1;dev[x.device]++;hrs[new Date(x.ts).getHours()]++;}
 if(x.type==='search')srch[x.meta&&x.meta.query||'—']=(srch[x.meta&&x.meta.query||'—']||0)+1;
 if(x.page)src[x.page]=(src[x.page]||0)+1;});
 const maxV=Math.max(1,...Object.values(byDay));
 const top=evs.map(e=>({t:e.title,v:e.views||0})).sort((a,b)=>b.v-a.v).slice(0,15);const maxT=Math.max(1,...top.map(t=>t.v));
 const maxH=Math.max(1,...hrs);
 $('#adm-body').innerHTML='<h1 class="pg">Аналитика</h1><div class="chips">'+[[1,'1д'],[7,'7д'],[30,'30д'],[90,'90д'],[3650,'всё']].map(p=>'<button class="chip '+(period===p[0]?'on':'')+'" data-per="'+p[0]+'">'+p[1]+'</button>').join('')+'</div>'
 +'<div class="stat-cards"><div class="stat-c"><div class="v">'+views.length+'</div><div class="l">Просмотры событий</div></div><div class="stat-c"><div class="v">'+sessions.size+'</div><div class="l">Сессии</div></div><div class="stat-c"><div class="v">'+uniques.size+'</div><div class="l">Уники</div></div><div class="stat-c"><div class="v">'+be.filter(per&&x=>x.type==='js_error').length+'</div><div class="l">Ошибки</div></div></div>'
 +'<div class="sec-title">Просмотры по дням</div><div class="bars">'+Object.keys(byDay).sort().slice(-14).map(k=>'<i style="height:'+(byDay[k]/maxV*100)+'%" title="'+k+': '+byDay[k]+'"></i>').join('')+'</div>'
 +'<div class="sec-title">Топ событий</div>'+top.map(t=>'<div class="barrow"><span class="bl">'+esc(t.t)+'</span><div class="bw"><div class="bf" style="width:'+(t.v/maxT*100)+'%"></div></div><span class="bv">'+t.v+'</span></div>').join('')
 +'<div class="sec-title">Устройства</div><div class="stat-cards"><div class="stat-c"><div class="v">'+dev.m+'</div><div class="l">Mobile</div></div><div class="stat-c"><div class="v">'+dev.d+'</div><div class="l">Desktop</div></div><div class="stat-c"><div class="v">'+dev.t+'</div><div class="l">Tablet</div></div></div>'
 +'<div class="sec-title">Источники (страницы)</div>'+Object.entries(src).sort((a,b)=>b[1]-a[1]).slice(0,8).map(s=>'<div class="barrow"><span class="bl">'+esc(s[0])+'</span><div class="bw"><div class="bf" style="width:'+(s[1]/Math.max(...Object.values(src),1)*100)+'%"></div></div><span class="bv">'+s[1]+'</span></div>').join('')
 +'<div class="sec-title">Поисковые запросы</div>'+(Object.keys(srch).length?Object.entries(srch).sort((a,b)=>b[1]-a[1]).slice(0,12).map(s=>'<span class="chip" style="margin:2px">'+esc(s[0])+' · '+s[1]+'</span>').join(''):'<span class="hint">Пока пусто</span>')
 +'<div class="sec-title">Часы активности</div><div class="bars">'+hrs.map((v,i)=>'<i style="height:'+(v/maxH*100)+'%" title="'+i+':00 — '+v+'"></i>').join('')+'</div>'
 +'<div style="display:flex;gap:8px;margin:16px 0"><button class="btn" id="exp-pdf">Экспорт PDF</button><button class="btn" id="exp-csv">Экспорт CSV</button></div>';
 $$('#adm-body [data-per]').forEach(b=>b.onclick=()=>{window.__anP=Number(b.dataset.per);admAnalytics();});
 $('#exp-csv').onclick=()=>{let csv='type,ts,page,device\n';be.forEach(x=>csv+=[x.type,x.ts,x.page,x.device].join(',')+'\n');download('analytics.csv',csv,'text/csv');};
 $('#exp-pdf').onclick=()=>{try{const doc=new window.jspdf.jsPDF();doc.text('Афиша Тюмень — аналитика',14,16);doc.autoTable({startY:24,head:[['Метрика','Значение']],body:[['Просмотры',views.length],['Сессии',sessions.size],['Уники',uniques.size],['Топ событий',top.map(t=>t.t+': '+t.v).join('; ')||'—']]});doc.save('analytics.pdf');}catch(e){toast('PDF-библиотека недоступна офлайн');}};
}
function localEvents(){return SQ.eventsAll();}
/* ============ 23. СОБЫТИЯ (АДМИН) ============ */
async function admEvents(){
 const evs=await SQ.eventsAll();
 $('#adm-body').innerHTML='<h1 class="pg">События</h1><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><a class="btn acc" href="#/admin/event/new">+ Событие</a><select id="ev-f" style="width:auto"><option value="">Все статусы</option><option value="published">Опубликованные</option><option value="draft">Черновики</option></select><input id="ev-q" placeholder="Поиск…" style="width:200px"></div><table class="tbl"><tr><th><input type="checkbox" id="ev-all"></th><th>Название</th><th>Дата</th><th>Просм.</th><th>Статус</th><th></th></tr>'+evs.map(ev=>'<tr><td><input type="checkbox" class="ev-sel" data-id="'+ev.id+'"></td><td><a href="#/admin/event/'+ev.id+'">'+esc(ev.title)+'</a></td><td>'+fmtDT(ev.start_at)+'</td><td>'+(ev.views||0)+'</td><td>'+(ev.status==='published'?'<span class="badge b-approved">публ.</span>':'<span class="badge">черновик</span>')+'</td><td><a class="btn sm" href="#/event/'+ev.id+'" title="Предпросмотр">👁</a> <button class="btn sm" onclick="nav(\'#/admin/event/'+ev.id+'\')">✎</button> <button class="btn sm" onclick="dupEvent('+ev.id+')">⧉</button> <button class="btn sm bad" onclick="delEvent('+ev.id+')">🗑</button></td></tr>').join('')+'</table>'
 +'<div style="display:flex;gap:8px;margin:12px 0"><button class="btn sm" onclick="massEvents(\'publish\')">Опубликовать выбранные</button><button class="btn sm" onclick="massEvents(\'unpublish\')">Снять</button><button class="btn sm bad" onclick="massEvents(\'delete\')">Удалить</button></div>';
 $('#ev-all').onchange=e=>$$('.ev-sel').forEach(c=>c.checked=e.target.checked);
 $('#ev-f').onchange=$('#ev-q').oninput=()=>{const f=$('#ev-f').value,q=$('#ev-q').value.toLowerCase();$('#adm-body').querySelectorAll('tr').forEach((tr,i)=>{if(!i)return;const t=tr.textContent.toLowerCase();tr.style.display=(!f||t.includes('публ.')&&f==='published'||t.includes('черновик')&&f==='draft')&&t.includes(q)?'':'none';});};
}
async function dupEvent(id){const ev=oneData('events',x=>x.id===id);if(!ev)return;const c=Object.assign({},ev,{id:null,title:ev.title+' (копия)',views:0});delete c.id;await DB.saveEvent(c);toast('Скопировано');admEvents();}
async function delEvent(id){openModal('<h3>Удалить событие?</h3><div style="display:flex;gap:10px;margin-top:14px"><button class="btn bad" id="d-yes">Удалить</button><button class="btn" id="d-no">Отмена</button></div>');$('#d-yes').onclick=async()=>{await DB.delEvent(id);closeModal();DB.log('delete_event',id);toast('Удалено');admEvents();};$('#d-no').onclick=closeModal;}
async function massEvents(action){
 const ids=$$('.ev-sel').filter(c=>c.checked).map(c=>c.dataset.id);
 if(!ids.length)return toast('Ничего не выбрано');
 if(action==='delete'){if(!confirm('Удалить '+ids.length+' событий?'))return;for(const i of ids)await DB.delEvent(i);}
 else{const evs=await SQ.eventsAll();for(const i of ids){const ev=evs.find(x=>String(x.id)===String(i));if(ev)await DB.saveEvent(Object.assign(ev,{status:action==='publish'?'published':'draft'}));}}
 DB.log('mass_'+action,ids.join(','));toast('Готово');admEvents();
}
async function admEventEditor(id){
 const cats=await SQ.cats();const venues=await SQ.venues();
