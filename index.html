<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Учёт смен, часов и выплат" />
  <title>Смены</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
</head>
<body>

  <!-- ============================ ВХОД ============================ -->
  <div id="authScreen" class="auth-screen hidden">
    <form id="authForm" class="auth-card" autocomplete="on" novalidate>
      <div class="auth-brand">
        <div class="auth-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="4" width="18" height="17" rx="3"/>
            <path d="M3 9h18M8 2v4M16 2v4"/>
            <path d="M8 14h3M8 17h6"/>
          </svg>
        </div>
        <h1 class="auth-title">Смены</h1>
        <p class="auth-sub">Вход в личный кабинет</p>
      </div>

      <div class="field">
        <label for="loginEmail">Логин (email)</label>
        <input type="email" id="loginEmail" name="email" autocomplete="username" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="loginPass">Пароль</label>
        <input type="password" id="loginPass" name="password" autocomplete="current-password" placeholder="Введите пароль" required />
      </div>

      <label class="check" id="rememberRow">
        <input type="checkbox" id="rememberMe" checked />
        <span class="check-box" aria-hidden="true"></span>
        <span>Запомнить меня</span>
      </label>

      <button type="submit" class="btn btn-primary" id="authSubmit">Войти</button>
      <p id="authError" class="form-error" role="alert"></p>
    </form>
  </div>

  <!-- ============================ ПИН: ВВОД ============================ -->
  <div id="pinScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="4" y="10" width="16" height="11" rx="2.5"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            <circle cx="12" cy="15.5" r="1.4"/>
          </svg>
        </div>
        <h1 class="auth-title">Введите ПИН</h1>
        <p class="auth-sub">4 цифры для доступа</p>
      </div>

      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" class="pin-input" autocomplete="off" placeholder="••••" aria-label="ПИН-код" />
      <p id="pinError" class="form-error" role="alert"></p>

      <button type="button" class="btn btn-primary" id="pinSubmit">Далее</button>
      <button type="button" class="btn btn-text" id="pinReset">Забыли ПИН? Выйти из аккаунта</button>
    </div>
  </div>

  <!-- ============================ ПИН: УСТАНОВКА ============================ -->
  <div id="pinSetupScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="4" y="10" width="16" height="11" rx="2.5"/>
            <path d="M8 10V7a4 4 0 0 1 7.5-2M17 10V7"/>
            <circle cx="12" cy="15.5" r="1.4"/>
          </svg>
        </div>
        <h1 class="auth-title">Установите ПИН</h1>
        <p class="auth-sub">Для быстрого входа на этом устройстве</p>
      </div>

      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinNew" class="pin-input" autocomplete="off" placeholder="ПИН" aria-label="Новый ПИН" />
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinNew2" class="pin-input" autocomplete="off" placeholder="Повтор" aria-label="Повтор ПИН" />
      <p id="pinSetupError" class="form-error" role="alert"></p>

      <button type="button" class="btn btn-primary" id="pinSave">Сохранить</button>
      <button type="button" class="btn btn-text" id="pinSkip">Пропустить</button>
    </div>
  </div>

  <!-- ============================ ПРИЛОЖЕНИЕ ============================ -->
  <div id="app" class="app hidden">

    <!-- Боковая навигация (ПК) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="4" width="18" height="17" rx="3"/>
            <path d="M3 9h18M8 2v4M16 2v4"/>
          </svg>
        </div>
        <span class="brand-name">Смены</span>
      </div>

      <nav class="nav" id="navDesktop" aria-label="Разделы">
        <button class="nav-item" data-page="shifts">Смены</button>
        <button class="nav-item" data-page="money">Деньги</button>
        <button class="nav-item" data-page="reports">Отчёты</button>
        <button class="nav-item" data-page="analytics">Аналитика</button>
        <button class="nav-item" data-page="refs">Справочники</button>
        <button class="nav-item" data-page="notifications">Уведомления</button>
        <button class="nav-item" data-page="admin">Администратор</button>
        <button class="nav-item" data-page="settings">Настройки</button>
      </nav>

      <div class="sidebar-footer">
        <span id="sidebarVersion" class="muted small">v1.0.0</span>
      </div>
    </aside>

    <div class="content-wrap">

      <header class="topbar">
        <h1 class="topbar-title" id="pageTitle">Смены</h1>

        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="bellBtn" aria-label="Уведомления" title="Уведомления">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9z"/>
              <path d="M10 19a2 2 0 0 0 4 0"/>
            </svg>
            <span class="badge hidden" id="bellBadge">0</span>
          </button>
        </div>
      </header>

      <main class="view" id="view" role="main"></main>

    </div>

    <!-- Нижняя навигация (телефон) -->
    <nav class="mobile-nav" id="navMobile" aria-label="Разделы">
      <button class="mnav-item" data-page="shifts">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>
        </svg>
        <span class="mnav-label">Смены</span>
      </button>
      <button class="mnav-item" data-page="money">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.4"/>
        </svg>
        <span class="mnav-label">Деньги</span>
      </button>
      <button class="mnav-item" data-page="reports">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
        </svg>
        <span class="mnav-label">Отчёты</span>
      </button>
      <button class="mnav-item" data-page="more">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
        <span class="mnav-label">Ещё</span>
      </button>
    </nav>

    <!-- Шторка «Ещё» -->
    <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
    <div class="sheet hidden" id="moreSheet" role="dialog" aria-modal="true" aria-label="Ещё разделы">
      <div class="sheet-handle"></div>
      <nav class="sheet-nav">
        <button class="sheet-item" data-page="analytics">Аналитика</button>
        <button class="sheet-item" data-page="refs">Справочники</button>
        <button class="sheet-item" data-page="notifications">Уведомления</button>
        <button class="sheet-item" data-page="admin">Администратор</button>
        <button class="sheet-item" data-page="settings">Настройки</button>
      </nav>
      <button class="btn btn-text sheet-close" id="sheetClose">Закрыть</button>
    </div>

    <!-- Тосты -->
    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
