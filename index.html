<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>Маршруты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f7f8fc;
    --card:#ffffff;
    --text:#111827;
    --text-2:#6b7280;
    --border:#e5e7eb;
    --primary:#4f46e5;
    --primary-hover:#4338ca;
    --primary-soft:#eef2ff;
    --danger:#dc2626;
    --danger-soft:#fef2f2;
    --success:#059669;
    --success-soft:#ecfdf5;
    --radius:20px;
    --radius-sm:14px;
    --shadow:0 1px 2px rgba(17,24,39,.04), 0 4px 20px rgba(17,24,39,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100dvh;font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;padding:0 16px 100px;min-height:100dvh}

  /* Заголовок */
  .header{padding:24px 4px 20px;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .header p{font-size:14px;color:var(--text-2);margin-top:2px}
  .icon-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--text-2);transition:background .15s;
  }
  .icon-btn:active{background:#eef0f5}

  /* Карточки */
  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px;margin-bottom:16px;
  }

  /* Поля ввода */
  .field{margin-bottom:14px;position:relative}
  .field label{
    display:block;font-size:13px;font-weight:500;
    color:var(--text-2);margin-bottom:6px;
  }
  .field input{
    width:100%;padding:14px 16px;font-size:16px;font-family:inherit;
    background:#f9fafb;color:var(--text);
    border:1.5px solid transparent;border-radius:var(--radius-sm);
    transition:border-color .15s, background .15s;
  }
  .field input:focus{
    outline:none;background:#fff;border-color:var(--primary);
  }
  .field input::placeholder{color:#9ca3af}

  /* Кнопки */
  .btn{
    width:100%;padding:16px 20px;font-size:16px;font-weight:600;font-family:inherit;
    border:none;border-radius:var(--radius-sm);cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:active{background:var(--primary-hover);transform:scale(.98)}
  .btn-primary:disabled{background:#a5a6f6;cursor:not-allowed;transform:none}
  .btn-secondary{
    background:var(--primary-soft);color:var(--primary);
  }
  .btn-secondary:active{background:#e0e7ff}

  /* Вкладки */
  .tabs{
    display:flex;background:#eef0f5;border-radius:var(--radius-sm);
    padding:4px;margin-bottom:20px;
  }
  .tabs button{
    flex:1;padding:12px;font-size:15px;font-weight:600;font-family:inherit;
    border:none;border-radius:11px;background:transparent;
    color:var(--text-2);cursor:pointer;transition:all .2s;
  }
  .tabs button.active{
    background:#fff;color:var(--text);
    box-shadow:0 1px 3px rgba(17,24,39,.08);
  }

  /* Сообщения */
  .alert{
    padding:14px 16px;border-radius:var(--radius-sm);
    font-size:14px;margin-bottom:16px;
    display:none;
  }
  .alert.show{display:block;animation:slideIn .2s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .alert.error{background:var(--danger-soft);color:#991b1b;border:1px solid #fecaca}
  .alert.success{background:var(--success-soft);color:#065f46;border:1px solid #a7f3d0}

  /* Профиль */
  .profile{
    display:flex;align-items:center;gap:14px;
    padding:20px;border-radius:var(--radius);
    background:linear-gradient(135deg, #eef2ff 0%, #f5f3ff 100%);
    margin-bottom:16px;
  }
  .profile .avatar{
    width:56px;height:56px;border-radius:50%;
    background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:600;flex-shrink:0;
  }
  .profile .info{flex:1;min-width:0}
  .profile .name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .profile .meta{font-size:13px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Секция */
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 4px;margin:20px 0 10px;
  }
  .section-head h2{font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
  .section-head .count{
    font-size:12px;font-weight:600;color:var(--primary);
    background:var(--primary-soft);padding:2px 10px;border-radius:100px;
  }

  /* Маршруты */
  .routes-list{display:grid;gap:10px}
  .route-item{
    display:flex;align-items:center;gap:14px;
    padding:16px;background:var(--card);border-radius:var(--radius-sm);
    box-shadow:var(--shadow);transition:transform .1s;
  }
  .route-item:active{transform:scale(.99)}
  .route-icon{
    width:40px;height:40px;border-radius:11px;
    background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .route-icon .material-symbols-outlined{font-size:22px}
  .route-item .content{flex:1;min-width:0}
  .route-item .name{font-size:15px;font-weight:500;word-break:break-word}
  .route-item .date{font-size:12px;color:var(--text-2);margin-top:3px}

  /* Пустое состояние */
  .empty{
    padding:40px 20px;text-align:center;color:var(--text-2);
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .empty .material-symbols-outlined{font-size:48px;color:#d1d5db;display:block;margin:0 auto 12px}
  .empty p{font-size:14px}

  /* Замеры */
  .timings{display:grid;gap:0}
  .timings .row{
    display:flex;justify-content:space-between;
    padding:12px 0;font-size:14px;
    border-bottom:1px solid #f3f4f6;
  }
  .timings .row:last-child{border-bottom:none}
  .timings .label{color:var(--text-2)}
  .timings .val{font-weight:600;font-variant-numeric:tabular-nums;color:var(--primary)}

  /* FAB */
  .fab{
    position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));
    right:calc(50% - 240px + 16px);
    width:60px;height:60px;border-radius:20px;
    background:var(--primary);color:#fff;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(79,70,229,.4);
    transition:transform .1s, box-shadow .15s;z-index:20;
  }
  .fab:active{transform:scale(.94);box-shadow:0 2px 8px rgba(79,70,229,.4)}
  .fab .material-symbols-outlined{font-size:28px}
  @media (max-width:520px){
    .fab{right:16px}
  }

  /* Bottom sheet */
  .scrim{
    position:fixed;inset:0;background:rgba(17,24,39,.5);
    display:none;z-index:30;opacity:0;transition:opacity .2s;
  }
  .scrim.open{display:block;opacity:1}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
    background:#fff;border-radius:24px 24px 0 0;
    padding:12px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:31;
  }
  .sheet.open{transform:translateY(0)}
  .sheet .handle{width:36px;height:4px;border-radius:2px;background:#e5e7eb;margin:0 auto 16px}
  .sheet h2{font-size:18px;font-weight:600;margin-bottom:20px}

  .hidden{display:none !important}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="authScreen" class="app hidden">
  <div class="header">
    <div>
      <h1>Маршруты</h1>
      <p>Войдите в аккаунт</p>
    </div>
  </div>

  <div class="tabs">
    <button id="tabLogin" class="active">Вход</button>
    <button id="tabRegister">Регистрация</button>
  </div>

  <div id="alertAuth" class="alert"></div>

  <div id="loginForm" class="card">
    <div class="field">
      <label for="loginLogin">Логин</label>
      <input id="loginLogin" type="text" placeholder="Введите логин" autocomplete="username" autocapitalize="off">
    </div>
    <div class="field">
      <label for="loginPassword">Пароль</label>
      <input id="loginPassword" type="password" placeholder="Введите пароль" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn btn-primary">Войти</button>
  </div>

  <div id="registerForm" class="card hidden">
    <div class="field">
      <label for="regFullName">ФИО</label>
      <input id="regFullName" type="text" placeholder="Иванов Иван Иванович" autocomplete="name">
    </div>
    <div class="field">
      <label for="regPhone">Телефон</label>
      <input id="regPhone" type="tel" placeholder="+7 900 000-00-00" autocomplete="tel">
    </div>
    <div class="field">
      <label for="regLogin">Логин</label>
      <input id="regLogin" type="text" placeholder="Латиница, цифры, точка, _" autocomplete="username" autocapitalize="off">
    </div>
    <div class="field">
      <label for="regPassword">Пароль</label>
      <input id="regPassword" type="password" placeholder="Минимум 6 символов" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="regPassword2">Повтор пароля</label>
      <input id="regPassword2" type="password" placeholder="Повторите пароль" autocomplete="new-password">
    </div>
    <button id="registerBtn" class="btn btn-primary">Зарегистрироваться</button>
  </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="appScreen" class="app hidden">
  <div class="header">
    <div>
      <h1>Маршруты</h1>
      <p>Управление поездками</p>
    </div>
    <button id="logoutBtn" class="icon-btn" aria-label="Выйти">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>

  <div class="profile">
    <div class="avatar" id="avatarLetter">U</div>
    <div class="info">
      <div class="name" id="profileName">—</div>
      <div class="meta" id="profileMeta">—</div>
    </div>
  </div>

  <div id="alertApp" class="alert"></div>

  <div class="section-head">
    <h2>Маршруты</h2>
    <span class="count" id="routesCount">0</span>
  </div>
  <div id="routesList" class="routes-list"></div>
  <div id="emptyNote" class="empty hidden">
    <span class="material-symbols-outlined">route</span>
    <p>Список пуст.<br>Нажмите «+», чтобы добавить маршрут.</p>
  </div>

  <div class="section-head">
    <h2>Скорость запросов</h2>
  </div>
  <div class="card">
    <div class="timings" id="timings"></div>
  </div>
</div>

<button id="fabAdd" class="fab hidden" aria-label="Добавить маршрут">
  <span class="material-symbols-outlined">add</span>
</button>

<div id="scrim" class="scrim"></div>
<div id="sheet" class="sheet">
  <div class="handle"></div>
  <h2>Новый маршрут</h2>
  <div class="field">
    <label for="routeName">Название</label>
    <input id="routeName" type="text" placeholder="Например: Центр — Вокзал">
  </div>
  <button id="addRouteBtn" class="btn btn-primary">Добавить</button>
</div>

<script>
const SUPABASE_URL = "https://zwejlhzohovnvfrqnzsj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_iSUugxnWXxWiwbERIYmG9Q_IC1gxme3";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const LS_KEY = 'routes_user';

let currentUser = null;
let timingsData = {};

function showAlert(id, msg, type = 'error') {
  const box = $(id);
  box.className = 'alert show ' + type;
  box.textContent = msg;
  if (type === 'success') setTimeout(() => { box.className = 'alert'; box.textContent = ''; }, 3500);
}
function hideAlerts() {
  ['alertAuth', 'alertApp'].forEach(id => { const b = $(id); b.className = 'alert'; b.textContent = ''; });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setTiming(key, ms) { timingsData[key] = ms; renderTimings(); }
function renderTimings() {
  const labels = { auth:'Вход', register:'Регистрация', list:'Загрузка списка', add:'Добавление' };
  const rows = Object.entries(timingsData).map(([k,v]) =>
    `<div class="row"><span class="label">${labels[k]||k}</span><span class="val">${Math.round(v)} мс</span></div>`);
  $('timings').innerHTML = rows.length ? rows.join('') : '<div class="row"><span class="label">Замеров пока нет</span></div>';
}
function translateError(err) {
  if (!err) return 'Неизвестная ошибка.';
  const m = (err.message || '').toLowerCase();
  if (m.includes('failed to fetch') || m.includes('network')) return 'Нет связи с сервером. Проверьте интернет.';
  if (m.includes('duplicate key') || m.includes('unique')) return 'Логин уже используется.';
  if (m.includes('relation') && m.includes('does not exist')) return 'Выполните SQL в Supabase SQL Editor.';
  if (m.includes('permission denied')) return 'Нет прав. Проверьте SQL-команды GRANT.';
  return err.message || 'Произошла ошибка.';
}

$('tabLogin').addEventListener('click', () => {
  $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active');
  $('loginForm').classList.remove('hidden'); $('registerForm').classList.add('hidden');
  hideAlerts();
});
$('tabRegister').addEventListener('click', () => {
  $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active');
  $('registerForm').classList.remove('hidden'); $('loginForm').classList.add('hidden');
  hideAlerts();
});

function showAuth() {
  $('authScreen').classList.remove('hidden');
  $('appScreen').classList.add('hidden');
  $('fabAdd').classList.add('hidden');
  closeSheet();
}
async function showApp(user) {
  currentUser = user;
  $('authScreen').classList.add('hidden');
  $('appScreen').classList.remove('hidden');
  $('fabAdd').classList.remove('hidden');

  $('profileName').textContent = user.full_name || '—';
  $('profileMeta').textContent = (user.login ? 'Логин: ' + user.login : '') + (user.phone ? ' · ' + user.phone : '');
  $('avatarLetter').textContent = (user.full_name || 'U').trim().charAt(0).toUpperCase();

  renderTimings();
  await loadRoutes();
}

async function register() {
  const fullName = $('regFullName').value.trim();
  const phone = $('regPhone').value.trim();
  const login = $('regLogin').value.trim().toLowerCase();
  const pass = $('regPassword').value;
  const pass2 = $('regPassword2').value;

  if (!fullName) return showAlert('alertAuth', 'Введите ФИО.');
  if (!phone) return showAlert('alertAuth', 'Введите телефон.');
  if (!/^[a-z0-9_.]{3,30}$/.test(login))
    return showAlert('alertAuth', 'Логин: 3–30 символов, латиница, цифры, _ и точка.');
  if (pass.length < 6) return showAlert('alertAuth', 'Пароль короче 6 символов.');
  if (pass !== pass2) return showAlert('alertAuth', 'Пароли не совпадают.');

  hideAlerts();
  const btn = $('registerBtn');
  btn.disabled = true;

  const t1 = performance.now();
  const { data: existing, error: checkErr } = await sb.from('users').select('id').eq('login', login).maybeSingle();
  setTiming('register', performance.now() - t1);

  if (checkErr) { btn.disabled = false; return showAlert('alertAuth', 'Ошибка: ' + translateError(checkErr)); }
  if (existing) { btn.disabled = false; return showAlert('alertAuth', 'Такой логин уже занят.'); }

  const t2 = performance.now();
  const { data, error } = await sb.from('users').insert({
    full_name: fullName, phone, login, password: pass
  }).select().single();
  setTiming('register', performance.now() - t2);

  btn.disabled = false;
  if (error) return showAlert('alertAuth', 'Ошибка: ' + translateError(error));

  localStorage.setItem(LS_KEY, JSON.stringify(data));
  await showApp(data);
  showAlert('alertApp', 'Аккаунт создан. Добро пожаловать.', 'success');
}

async function login() {
  const login = $('loginLogin').value.trim().toLowerCase();
  const pass = $('loginPassword').value;
  if (!login || !pass) return showAlert('alertAuth', 'Введите логин и пароль.');

  hideAlerts();
  const btn = $('loginBtn');
  btn.disabled = true;

  const t0 = performance.now();
  const { data, error } = await sb.from('users')
    .select('*').eq('login', login).eq('password', pass).maybeSingle();
  setTiming('auth', performance.now() - t0);

  btn.disabled = false;
  if (error) return showAlert('alertAuth', 'Ошибка: ' + translateError(error));
  if (!data) return showAlert('alertAuth', 'Неверный логин или пароль.');

  localStorage.setItem(LS_KEY, JSON.stringify(data));
  await showApp(data);
}

function logout() {
  hideAlerts();
  localStorage.removeItem(LS_KEY);
  currentUser = null;
  $('loginLogin').value = ''; $('loginPassword').value = '';
  showAuth();
}

async function loadRoutes() {
  const t0 = performance.now();
  const { data, error } = await sb.from('routes')
    .select('id, name, created_at')
    .order('created_at', { ascending: false })
    .limit(50);
  setTiming('list', performance.now() - t0);

  if (error) return showAlert('alertApp', 'Ошибка загрузки: ' + translateError(error));

  const list = $('routesList');
  list.innerHTML = '';
  const count = data ? data.length : 0;
  $('routesCount').textContent = count;

  if (count === 0) {
    $('emptyNote').classList.remove('hidden');
    return;
  }
  $('emptyNote').classList.add('hidden');
  for (const r of data) {
    const date = r.created_at
      ? new Date(r.created_at).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
      : '';
    const div = document.createElement('div');
    div.className = 'route-item';
    div.innerHTML = `
      <div class="route-icon"><span class="material-symbols-outlined">route</span></div>
      <div class="content">
        <div class="name">${escapeHtml(r.name)}</div>
        <div class="date">${escapeHtml(date)}</div>
      </div>`;
    list.appendChild(div);
  }
}

function openSheet() {
  hideAlerts();
  $('scrim').classList.add('open');
  $('sheet').classList.add('open');
  setTimeout(() => $('routeName').focus(), 280);
}
function closeSheet() {
  $('scrim').classList.remove('open');
  $('sheet').classList.remove('open');
  $('routeName').value = '';
}

async function addRoute() {
  const name = $('routeName').value.trim();
  if (!name) return showAlert('alertApp', 'Введите название.');
  hideAlerts();
  const btn = $('addRouteBtn');
  btn.disabled = true;

  const t0 = performance.now();
  const { error } = await sb.from('routes').insert({ name });
  setTiming('add', performance.now() - t0);

  btn.disabled = false;
  if (error) return showAlert('alertApp', 'Ошибка: ' + translateError(error));

  closeSheet();
  showAlert('alertApp', 'Маршрут добавлен.', 'success');
  await loadRoutes();
}

$('loginBtn').addEventListener('click', login);
$('registerBtn').addEventListener('click', register);
$('logoutBtn').addEventListener('click', logout);
$('addRouteBtn').addEventListener('click', addRoute);
$('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('routeName').addEventListener('keydown', e => { if (e.key === 'Enter') addRoute(); });
$('fabAdd').addEventListener('click', openSheet);
$('scrim').addEventListener('click', closeSheet);

(async function init() {
  const saved = localStorage.getItem(LS_KEY);
  if (saved) {
    try {
      const u = JSON.parse(saved);
      await showApp(u);
      return;
    } catch (e) {}
  }
  showAuth();
})();
</script>
</body>
</html>
